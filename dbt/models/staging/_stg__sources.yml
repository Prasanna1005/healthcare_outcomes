version: 2

sources:
  - name: raw
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'HEALTHCARE_DB') }}"
    schema: RAW

    tables:
      - name: raw_patients
        columns:
          - name: patient_id
            data_tests: [not_null, unique]

      - name: raw_encounters
        columns:
          - name: encounter_id
            data_tests: [not_null, unique]
          - name: patient_id
            data_tests: [not_null]

      - name: raw_observations
        columns:
          - name: observation_id
            data_tests: [not_null, unique]

      - name: raw_conditions
        columns:
          - name: condition_id
            data_tests: [not_null, unique]

      - name: raw_medications
        columns:
          - name: medication_request_id
            data_tests: [not_null, unique]

      - name: raw_procedures
        columns:
          - name: procedure_id
            data_tests: [not_null, unique]