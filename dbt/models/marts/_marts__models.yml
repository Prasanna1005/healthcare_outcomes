version: 2

models:
  # ---- core ----
  - name: dim_date
    columns:
      - name: date_sk
        data_tests: [not_null, unique]

  - name: dim_patient
    description: "Patient dimension. Masking policies + row access policy applied via on-run-end macro."
    config:
      contract:
        enforced: true
    columns:
      - name: patient_sk
        data_type: varchar
        constraints:
          - type: not_null
        data_tests: [unique]

      - name: patient_business_key
        data_type: varchar
        constraints:
          - type: not_null
        data_tests: [unique]

      - name: first_name
        data_type: varchar

      - name: last_name
        data_type: varchar

      - name: mrn
        data_type: varchar

      - name: date_of_birth
        data_type: date

      - name: phone_number
        data_type: varchar

      - name: email
        data_type: varchar

      - name: address_line1
        data_type: varchar

      - name: address_postal_code
        data_type: varchar

      - name: age_years
        data_type: number

      - name: age_band
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['pediatric', 'adult', 'senior']

      - name: gender
        data_type: varchar

      - name: race
        data_type: varchar

      - name: ethnicity
        data_type: varchar

      - name: marital_status
        data_type: varchar

      - name: address_state
        data_type: varchar

      - name: insurance_plan
        data_type: varchar

      - name: primary_language
        data_type: varchar

      - name: is_deceased
        data_type: boolean

      - name: deceased_date
        data_type: date

      - name: created_at
        data_type: timestamp_ntz

      - name: updated_at
        data_type: timestamp_ntz

  - name: fct_encounters
    columns:
      - name: encounter_id
        data_tests: [not_null, unique]

      - name: patient_business_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_business_key

      - name: encounter_class
        data_tests:
          - accepted_values:
              arguments:
                values: ['outpatient', 'ambulatory', 'emergency', 'inpatient']

      - name: length_of_stay_hours
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  # ---- clinical ----
  - name: mart_readmission_risk
    columns:
      - name: encounter_id
        data_tests: [not_null, unique]

      - name: risk_band
        data_tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high']

  - name: mart_length_of_stay_analytics

  - name: mart_condition_prevalence
    columns:
      - name: icd10_code
        data_tests: [not_null]

  # ---- governance ----
  - name: mart_governance_audit
    description: "Continuously-rebuilt audit of governance policy attachment"

exposures:
  - name: clinical_dashboard
    type: dashboard
    maturity: high
    description: "Readmission risk + LOS + condition prevalence"
    depends_on:
      - ref('mart_readmission_risk')
      - ref('mart_length_of_stay_analytics')
      - ref('mart_condition_prevalence')
    owner:
      name: MSc Capstone
      email: msc.student@example.com

  - name: governance_dashboard
    type: dashboard
    maturity: high
    description: "Continuous PHI policy compliance"
    depends_on:
      - ref('mart_governance_audit')
    owner:
      name: MSc Capstone
      email: msc.student@example.com